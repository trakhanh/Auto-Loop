<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#3f7bff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- nền bo góc -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shine)"/>
  <!-- vòng lặp: cung tròn ~290° với mũi tên -->
  <path d="M 186.5 92 A 70 70 0 1 0 196 140" fill="none" stroke="#ffffff" stroke-width="20"
        stroke-linecap="round"/>
  <path d="M 162 82 L 200 74 L 196 113 Z" fill="#ffffff" stroke="#ffffff" stroke-width="8"
        stroke-linejoin="round"/>
  <!-- nút phát -->
  <path d="M 110 98 L 110 158 L 160 128 Z" fill="#ffffff" stroke="#ffffff" stroke-width="10"
        stroke-linejoin="round"/>
  <!-- nốt nhạc nhỏ -->
  <circle cx="204" cy="196" r="13" fill="#22d3ee"/>
  <rect x="211" y="150" width="6" height="46" rx="3" fill="#22d3ee"/>
  <path d="M 214 150 q 18 6 18 22 q -6 -10 -18 -10 Z" fill="#22d3ee"/>
</svg>
